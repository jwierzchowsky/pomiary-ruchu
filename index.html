:root{color-scheme:light dark;--bg:#eef2f7;--panel:#fff;--ink:#15283c;--muted:#5b6b7c;--line:#d9e2eb;--blue:#1455b5;--cell:#e8eff7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:620px;margin:auto;padding: max(10px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}h1{font-size:25px;margin:6px 0 14px}h2{font-size:18px;margin:0 0 8px}p{margin:7px 0;line-height:1.4}.muted,small{color:var(--muted)}button,input{font:inherit}button{border:0;border-radius:9px;background:var(--cell);color:var(--ink);min-height:42px;padding:9px 12px;font-weight:650;touch-action:manipulation;cursor:pointer}button:active{filter:brightness(.8)}button:disabled{opacity:.35;cursor:default}.primary{background:var(--blue);color:white}.wide{width:100%}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.stack{display:grid;gap:8px}.progress{display:flex;gap:4px;margin:9px 0}.progress i{height:5px;background:var(--line);flex:1;border-radius:5px}.progress .done{background:#168054}.progress .partial{background:#d58a13}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}label{display:block;margin:9px 0 4px}.tabs,.ped{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.tabs button{color:white;opacity:.62;min-height:43px}.tabs .selected{opacity:1;outline:2px solid var(--ink);outline-offset:-2px}.matrix{display:grid;grid-template-columns:38px repeat(4,minmax(0,1fr));gap:4px;align-items:center;margin:6px 0}.matrix button{padding:0;min-height:clamp(32px,4.9dvh,45px);font-size:17px;font-variant-numeric:tabular-nums}.matrix .head{color:white;text-align:center;border-radius:5px;font-size:13px;padding:5px 0;font-weight:700}.matrix .cat{font-weight:700;font-size:13px}.matrix .off{opacity:.25;text-align:center}.ped>div{border:1px solid var(--line);border-radius:8px;padding:3px;display:grid;gap:3px}.ped b{display:block;text-align:center;color:white;border-radius:4px;font-size:13px;padding:2px}.ped button{min-height:35px;padding:3px 5px;display:flex;justify-content:space-between;align-items:center}.count{font-variant-numeric:tabular-nums}.measure{padding-top:4px}.measure .row{gap:5px}.measure h2{margin:0;font-size:15px}.clock{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums}.notice{color:#a15a00;font-size:12px}.measure .panel{padding:7px;margin:6px 0}.actions{display:flex;gap:6px;margin-top:6px}.actions button{flex:1;font-size:13px;min-height:38px}.last{font-size:12px;min-height:16px;margin:4px 0}.danger{color:#b42318}.link{background:transparent;padding:5px}.tag{font-size:12px;font-weight:650}.legend{font-size:12px;line-height:1.6}.status{font-size:13px}.file{display:none}@media(prefers-color-scheme:dark){:root{--bg:#101a28;--panel:#192638;--ink:#e6edf6;--muted:#a8b7c8;--line:#34465b;--blue:#2263c9;--cell:#263b52}.notice{color:#ffbe60}.danger{color:#ff9d92}}@media(max-height:720px){.matrix{gap:3px}.matrix button{min-height:30px}.ped button{min-height:30px}.measure .panel{margin:3px 0}.tabs button{min-height:36px}.clock{font-size:20px}}
</style></head><body><main id="app"></main><input type="file" id="restore" accept=".json,application/json" class="file"><script>
'use strict';
const DIR=['A','B','C','D'], CAT=['SO','SD','SC','SCC','A','AP','R','M','RO'], COLORS=['#245bb5','#a35b08','#087a58','#8047ad'], HOURS=[6,7,15,16], KEY='pomiary-ruchu-v1';
const names={SO:'samochód osobowy',SD:'samochód dostawczy',SC:'ciężarowy bez naczepy',SCC:'ciężarowy z naczepą',A:'autobus',AP:'autobus przegubowy',R:'rower',M:'motor',RO:'rolnicze'};
const app=document.getElementById('app');let db=[],view='list',pid=null,dir='A',editHour=null,manual=false,screenLock=null,lastMessage='',storageOK=true;
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const dateNow=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const timeLabel=h=>`${String(h).padStart(2,'0')}:00 – ${String(h+1).padStart(2,'0')}:00`;
const at=(p,h)=>new Date(`${p.date}T${String(h).padStart(2,'0')}:00:00`).getTime();
const get=()=>db.find(p=>p.id===pid); const slot=(p,h)=>p.slots[h];
function fresh(name,date){return {id:globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random(),name,date,slots:Object.fromEntries(HOURS.map(h=>[h,{status:'pending',counts:{},events:[],started:null,ended:null,gaps:[]} ])),run:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;mirrorWrite(JSON.stringify(db));cloudStatus();let hours=db.map(p=>p.id+HOURS.map(h=>p.slots[h].status).join()).join();if(hours!==previousHours){previousHours=hours;setTimeout(()=>cloudSync(),0)}return true}catch(e){storageOK=false;alert('Nie udało się zapisać danych! Wyeksportuj kopię JSON przed zamknięciem aplikacji.');return false}}
try{db=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(db))throw Error()}catch(e){storageOK=false;db=[];alert('Nie udało się odczytać lokalnych projektów. Przywróć kopię JSON, jeśli ją masz.')}
const CLIENT='9da3874b-41a5-44ca-bed9-66adabcaa65f', REDIRECT='https://jwierzchowsky.github.io/pomiary-ruchu/', AUTH='https://login.microsoftonline.com/consumers/oauth2/v2.0/', SCOPE='https://graph.microsoft.com/Files.ReadWrite.AppFolder offline_access';
let previousHours='', token=null, busy=false, cloudMsg='Nie połączono z OneDrive', lastCloud='', uploaded='', mirrorOK=false, mirror=null, serial=Promise.resolve();
const b64=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
const random=()=>b64(crypto.getRandomValues(new Uint8Array(32)));
function cloudStatus(){let el=document.getElementById('cloud-status');if(el)el.textContent=(storageOK?'Lokalny zapis OK':'BŁĄD lokalnego zapisu')+' · '+(mirrorOK?'IndexedDB OK':'IndexedDB oczekuje / niedostępna')+' · '+cloudMsg+(lastCloud?' · ostatnia kopia '+lastCloud:'');}
function cloudPanel(){return `<div class="panel stack"><b>Kopie zapasowe · v1.1.1</b><small id="cloud-status"></small><button data-act="cloud-login">Połącz / odnów OneDrive</button><button data-act="cloud-sync">Wyślij kopię teraz</button><button data-act="cloud-restore">Odzyskaj z OneDrive</button><button data-act="cloud-share">Zapisz kopię w Plikach / iCloud</button><button data-act="cloud-logout">Odłącz OneDrive</button></div>`}
async function loginCloud(){if(![REDIRECT,REDIRECT+'index.html'].includes(location.origin+location.pathname)){alert('Logowanie działa pod '+REDIRECT);return}if(location.pathname.endsWith('/index.html'))history.replaceState(null,'',REDIRECT);if(db.some(p=>p.run)){alert('Zaloguj się przed rozpoczęciem cyklu.');return}let verifier=random(),state=random(),challenge=b64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));localStorage.setItem('traffic-pkce',JSON.stringify({verifier,state,created:Date.now()}));sessionStorage.setItem('traffic-pkce',JSON.stringify({verifier,state,created:Date.now()}));location.href=AUTH+'authorize?'+new URLSearchParams({client_id:CLIENT,response_type:'code',redirect_uri:REDIRECT,response_mode:'query',scope:SCOPE,state,code_challenge:challenge,code_challenge_method:'S256'});}
async function exchange(params){let r=await fetch(AUTH+'token',{method:'POST',body:new URLSearchParams({client_id:CLIENT,scope:SCOPE,...params})});let t=await r.json();if(!r.ok)throw Error(t.error_description||t.error||'Logowanie nieudane');token={access:t.access_token,refresh:t.refresh_token||token?.refresh,expires:Date.now()+t.expires_in*1000};sessionStorage.setItem('traffic-token',JSON.stringify(token));return token.access;}
async function access(){if(token?.access&&token.expires>Date.now()+60000)return token.access;if(!token?.refresh)throw Error('Połącz OneDrive');return exchange({grant_type:'refresh_token',refresh_token:token.refresh});}
async function graph(path,options={}){let a=await access();let r=await fetch('https://graph.microsoft.com/v1.0'+path,{...options,headers:{Authorization:'Bearer '+a,...options.headers}});if(!r.ok)throw Error('OneDrive HTTP '+r.status);return r;}
function device(){let k='traffic-device-id',v=localStorage.getItem(k);if(!v){v=crypto.randomUUID();localStorage.setItem(k,v)}return v;}
function snapshot(){return JSON.stringify({version:1,projects:db});}
async function cloudSync(force=false){if(busy||!token||!db.length)return;if(!navigator.onLine){cloudMsg='Offline – kopia oczekuje';cloudStatus();return}let data=snapshot();if(!force&&data===uploaded)return;busy=true;cloudMsg='Wysyłanie kopii…';cloudStatus();try{let id=device(),base='/me/drive/special/approot:/';await graph('/me/drive/special/approot');let put=(name,body)=>graph(base+encodeURIComponent(name)+':/content',{method:'PUT',headers:{'Content-Type':'application/json'},body});await put('aktualny-'+id+'.json',data);for(let p of JSON.parse(data).projects)for(let h of HOURS){let s=p.slots[h];if(s.status==='done'||s.status==='partial'&&s.ended){let key='traffic-hour-'+p.id+'-'+h,body=JSON.stringify({version:1,projects:[p]});if(!localStorage.getItem(key)){await put('godzina-'+p.id+'-'+h+'-'+id+'.json',body);localStorage.setItem(key,'1')}}}uploaded=data;lastCloud=new Date().toLocaleTimeString('pl-PL');cloudMsg='OneDrive OK'}catch(e){cloudMsg='Błąd kopii: '+e.message}finally{busy=false;cloudStatus()}}
async function restoreCloud(){if(db.some(p=>p.run))return alert('Zakończ aktywny cykl przed odzyskiwaniem.');if(busy)return alert('Trwa synchronizacja.');busy=true;try{let files=[],path='/me/drive/special/approot/children';while(path){let result=await (await graph(path)).json();files.push(...result.value.filter(x=>x.name.endsWith('.json')&&x.file));path=result['@odata.nextLink']?.replace('https://graph.microsoft.com/v1.0','')||null}files.sort((a,b)=>b.lastModifiedDateTime.localeCompare(a.lastModifiedDateTime));if(!files.length)return alert('Brak kopii.');let n=prompt(files.map((x,i)=>`${i+1}. ${x.name} (${x.lastModifiedDateTime})`).join('\n')+'\nWpisz numer kopii:','1');if(n===null)return;let f=files[Number(n)-1];if(!f)return;let meta=await (await graph('/me/drive/items/'+encodeURIComponent(f.id))).json();let url=meta['@microsoft.graph.downloadUrl'];if(!url)throw Error('Brak adresu pobrania');let r=await fetch(url);if(!r.ok)throw Error('Nie udało się pobrać');let data=await r.json();if(data.version!==1||!Array.isArray(data.projects)||!data.projects.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&HOURS.every(h=>p.slots?.[h]&&['pending','active','partial','done'].includes(p.slots[h].status)&&p.slots[h].counts&&Object.values(p.slots[h].counts).every(v=>Number.isSafeInteger(v)&&v>=0)&&Array.isArray(p.slots[h].events)&&Array.isArray(p.slots[h].gaps))))throw Error('Nieprawidłowa kopia');if(!confirm('Dodać odzyskane projekty jako osobne kopie? Istniejące dane nie zostaną nadpisane.'))return;for(let p of data.projects){if(db.some(x=>x.id===p.id)){p.id=crypto.randomUUID();p.name+=' (odzyskany)'}p.run=null;for(let h of HOURS)if(p.slots[h].status==='active')p.slots[h].status='partial';db.push(p)}save();go('list')}catch(e){alert(e.message)}finally{busy=false;cloudStatus()}}
async function shareCloud(){let file=new File([snapshot()],'pomiary-kopia-'+dateNow()+'.json',{type:'application/json'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]})}catch(e){if(e.name!=='AbortError')alert(e.message)}}else download(file,file.name,file.type)}
function mirrorWrite(data){if(!mirror)return;serial=serial.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{let t=mirror.transaction('backup','readwrite');t.objectStore('backup').put(data,'current');t.oncomplete=()=>{mirrorOK=true;cloudStatus();resolve()};t.onerror=t.onabort=()=>{mirrorOK=false;cloudStatus();reject(t.error)}}));serial.catch(()=>{});}
async function initCloud(){try{token=JSON.parse(sessionStorage.getItem('traffic-token')||'null')}catch{}let q=new URLSearchParams(location.search);if(q.has('code')||q.has('error')){try{let p=JSON.parse(sessionStorage.getItem('traffic-pkce')||localStorage.getItem('traffic-pkce')||'null');if(!p||p.state!==q.get('state')||Date.now()-p.created>900000)throw Error('Nie udało się powrócić do tej samej sesji logowania. Uruchom logowanie ponownie z aplikacji na ekranie początkowym.');if(q.has('error'))throw Error(q.get('error_description')||q.get('error'));await exchange({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIRECT,code_verifier:p.verifier});cloudMsg='Połączono'}catch(e){cloudMsg=e.message}finally{sessionStorage.removeItem('traffic-pkce');localStorage.removeItem('traffic-pkce');history.replaceState(null,'',location.pathname)}}else if(token)cloudMsg='OneDrive połączony – oczekuje na kopię';cloudStatus();if(token)cloudSync();}
function initMirror(){try{let r=indexedDB.open('pomiary-mirror-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('backup');r.onsuccess=()=>{mirror=r.result;let g=mirror.transaction('backup').objectStore('backup').get('current');g.onsuccess=()=>{if(!db.length&&g.result){try{let old=JSON.parse(g.result);if(old.length&&confirm('Odzyskać projekty z lokalnej kopii IndexedDB?')){db=old;save();render();return}if(old.length)return}catch{}}mirrorWrite(JSON.stringify(db))};};r.onerror=()=>{mirrorOK=false;cloudStatus()}}catch{}}

function go(v,id=pid){let old=get();if(view==='measure'&&!manual&&v!=='measure'&&old?.run){old.run.leftAt=Date.now();save()}if(v==='measure'){let next=db.find(x=>x.id===id);if(next?.run?.leftAt){recordGap(next,next.run.leftAt,Date.now());delete next.run.leftAt;save()}}view=v;pid=id;manual=false;render();window.scrollTo(0,0)}
function count(s,k){return s.counts[k]||0}function totals(s,ped=false){return Object.entries(s.counts).filter(([k])=>k.startsWith('P:')===ped).reduce((a,[k,v])=>a+v,0)}
function status(s){return ({pending:'Oczekuje',active:'W toku',done:'Zapisano',partial:'Niepełny / przerwany'})[s.status]||'Oczekuje'}
function progress(p){return HOURS.map(h=>`<i class="${slot(p,h).status}"></i>`).join('')}
function renderBase(){let p=get();if(view==='list'){app.innerHTML=`<h1>Pomiary ruchu</h1><button class="primary wide" data-act="new">＋ Nowy projekt</button><p class="muted">Zapisane projekty · ${db.length}</p>${db.slice().reverse().map(p=>`<div class="panel"><div class="row"><div><h2>${esc(p.name)}</h2><small>${esc(p.date)}</small></div><button data-act="open" data-id="${esc(p.id)}">Otwórz ›</button></div><div class="progress">${progress(p)}</div><small>${HOURS.filter(h=>slot(p,h).status==='done').length}/4 pełnych godzin${p.run?' · cykl aktywny':''}</small></div>`).join('')||'<div class="panel muted">Nie ma jeszcze projektów.</div>'}<div class="panel stack"><button data-act="backup">Eksport kopii wszystkich projektów</button><button data-act="restore">Przywróć kopię JSON</button><small>Dane pozostają w tej przeglądarce. Regularnie zapisuj kopię. W Safari wybierz Udostępnij → Do ekranu początkowego.</small></div>`;return}
if(view==='new'){app.innerHTML=`<button class="link" data-act="list">‹ Projekty</button><h1>Nowy projekt</h1><form id="newForm" class="panel"><label for="n">Nazwa skrzyżowania</label><input id="n" required maxlength="120" placeholder="np. Morwowa"><label for="dt">Data pomiaru</label><input id="dt" type="date" required value="${dateNow()}"><p class="muted">06:00–08:00 oraz 15:00–17:00 · interwał 60 min</p><button class="primary wide" type="submit">Utwórz projekt</button></form>`;return}
if(!p){go('list');return}if(view==='project'){app.innerHTML=`<button class="link" data-act="list">‹ Projekty</button><h1>${esc(p.name)}</h1><p class="muted">${esc(p.date)}</p><div class="progress">${progress(p)}</div>${[[6,7],[15,16]].map((hs,i)=>`<section class="panel"><h2>${i?'Pomiar popołudniowy':'Pomiar poranny'}</h2>${hs.map(h=>`<div class="row" style="margin:9px 0"><div><b>${timeLabel(h)}</b><br><small>${status(slot(p,h))} · ${totals(slot(p,h))} poj. / ${totals(slot(p,h),true)} pies.</small></div><button data-act="edit" data-h="${h}" ${p.run?'disabled':''}>Korekta</button></div>`).join('')}<div class="stack">${p.run&&p.run.end===hs[1]+1?'<button class="primary" data-act="resume">Wróć do pomiaru</button>':hs.every(h=>slot(p,h).status==='done')?'':`<button class="primary" data-act="start" data-h="${hs[0]}" ${p.run?'disabled':''}>Rozpocznij cykl ${hs[0]}:00</button><button data-act="start" data-h="${hs[1]}" ${p.run?'disabled':''}>Rozpocznij tylko drugą godzinę</button>`}</div></section>`).join('')}<div class="panel stack"><button class="primary" data-act="xlsx">Pobierz XLSX – ${HOURS.every(h=>slot(p,h).status==='done')?'pełny pomiar':'wyniki częściowe'}</button><button data-act="backup">Kopia JSON</button><button data-act="delete" class="danger" ${p.run?'disabled':''}>Usuń projekt</button><small>Niepełne godziny są oznaczone w arkuszu Status. Korekta ręczna nie oznacza godziny jako pełnej.</small></div>`;return}
renderMeasure(p)}
function current(p,now=Date.now()){if(!p.run)return null;let r=p.run;if(now<at(p,r.start))return null;let h=HOURS.find(h=>h>=r.start&&h<r.end&&now>=at(p,h)&&now<at(p,h+1));return h??null}
function sync(p,now=Date.now()){if(!p.run)return false;let r=p.run,changed=false;if(r.leftAt&&now>=at(p,r.end)){recordGap(p,r.leftAt,now);delete r.leftAt;changed=true}if(r.hiddenAt&&now>=at(p,r.end)){recordGap(p,r.hiddenAt,now);delete r.hiddenAt;changed=true}for(let h of HOURS.filter(h=>h>=r.start&&h<r.end)){let s=slot(p,h),start=at(p,h),end=at(p,h+1);if(now>=end&&['pending','active'].includes(s.status)){if(s.started===null&&r.started<=start&&h!==r.start&&!r.leftAt&&!r.hiddenAt){s.started=start}if(r.leftAt&&r.leftAt<end&&now>start)s.gaps.push([r.leftAt,now]);if(r.hiddenAt&&r.hiddenAt<end&&now>start)s.gaps.push([r.hiddenAt,now]);s.ended=end;s.status=s.started!==null&&s.started<=start+1000&&!s.gaps.length?'done':'partial';changed=true}else if(now>=start&&now<end&&s.status==='pending'){s.status='active';s.started=Math.max(start,r.started);changed=true}}if(now>=at(p,r.end)){p.run=null;changed=true}if(changed)save();return changed}
function renderMeasure(p){let h=manual?editHour:current(p),s=h===null?null:slot(p,h),enabled=!!s;let upcoming=!manual&&p.run&&Date.now()<at(p,p.run.start);app.innerHTML=`<section class="measure"><div class="row"><button class="link" data-act="project">‹ Projekt</button><small>${esc(p.name)}</small><span class="tag">${manual?'KOREKTA':upcoming?'OCZEKIWANIE':'POMIAR'}</span></div><div class="row"><div><h2 id="interval">${h===null?(upcoming?timeLabel(p.run.start):'Cykl zakończony'):timeLabel(h)}</h2><small id="remain"></small></div><div style="text-align:right"><div class="clock" id="clock">--:--:--</div><small id="totals">${s?`${totals(s)} poj. · ${totals(s,true)} pies.`:''}</small></div></div>${manual?'<p class="notice">Dotknij, aby dodać. Włącz −, aby odjąć.</p>':''}<div class="tabs">${DIR.map((d,i)=>`<button style="background:${COLORS[i]}" class="${d===dir?'selected':''}" data-act="dir" data-d="${d}">Wlot ${d}</button>`).join('')}</div><div class="panel"><div class="matrix"><span class="muted">Typ</span>${DIR.map((d,i)=>`<div class="head" style="background:${COLORS[i]}">${dir}→${d}</div>`).join('')}${CAT.map(c=>`<span class="cat" title="${names[c]}">${c}</span>${DIR.map(d=>d===dir&&['B','D'].includes(d)?'<span class="off">—</span>':counter(s,`V:${dir}:${d}:${c}`,enabled)).join('')}`).join('')}</div></div><div class="row"><b>Piesi – wszystkie wloty</b><small>L / P</small></div><div class="ped">${DIR.map((d,i)=>`<div><b style="background:${COLORS[i]}">${d}</b>${['L','P'].map(x=>counter(s,`P:${d}:${x}`,enabled,x)).join('')}</div>`).join('')}</div><div class="actions"><button data-act="undo" ${!s||!s.events.length?'disabled':''}>↶ Cofnij ostatnie</button>${manual?`<button data-act="minus" class="${minus?'primary':''}">${minus?'− Odejmowanie':'＋ Dodawanie'}</button>`:'<button data-act="stop">Zakończ / przerwij</button>'}</div><p class="last muted" id="last">${esc(lastMessage||'Dotknięcie = 1 pojazd lub pieszy')}</p><small>${storageOK?'Zapis lokalny aktywny':'BŁĄD ZAPISU'}${manual?' · zmiany zapisują się od razu':''}</small></section>`;updateClock()}
function counter(s,k,enabled,label=''){return `<button data-act="count" data-k="${k}" ${enabled?'':'disabled'} aria-label="${k}">${label?`<span>${label}</span>`:''}<span class="count" data-val="${k}">${s?count(s,k):0}</span></button>`}
let minus=false;
function updateClock(){if(view!=='measure')return;let p=get();if(!p)return;let now=Date.now(),h=manual?editHour:current(p);let el=document.getElementById('clock');if(!el)return;el.textContent=new Date(now).toLocaleTimeString('pl-PL');let target=manual?null:h!==null?at(p,h+1):p.run?at(p,p.run.start):null;let rem=Math.max(0,Math.ceil((target-now)/1000));document.getElementById('remain').textContent=target?`${h===null?'Start za':'Koniec za'} ${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`:''}
